<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offload</title>
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Offload">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div id="top">
      <form id="capture" autocomplete="off">
        <input id="input" type="text" enterkeyhint="done"
               placeholder="떠오른 걸 바로 적거나 말하세요" aria-label="할 일 입력">
        <button type="submit" aria-label="추가">＋</button>
      </form>
      <div id="targets" role="group" aria-label="어디에 담을지">
        <button type="button" data-target="day">오늘</button>
        <button type="button" data-target="week">이번 주 안에</button>
        <button type="button" data-target="month">이번 달 안에</button>
      </div>
    </div>
    <div id="sync">
      <span id="sync-text"></span>
      <button id="sync-btn" hidden></button>
    </div>

    <section>
      <h2>오늘 <span id="today-label" class="muted"></span></h2>
      <ul id="today" class="list"></ul>
      <p id="today-empty" class="empty">오늘 할 일이 비어 있어요. 마음 편히.</p>
    </section>

    <section>
      <h2>이번 주 안에 <span class="muted">날짜 없이 쌓아 두기</span></h2>
      <ul id="bucket-week" class="list"></ul>
      <p id="bucket-week-empty" class="empty">이번 주 안에 하면 되는 일을 던져 두세요.</p>
    </section>

    <section>
      <h2>이번 달 안에</h2>
      <ul id="bucket-month" class="list"></ul>
      <p id="bucket-month-empty" class="empty">이번 달 안에 하면 되는 일을 던져 두세요.</p>
    </section>

    <section>
      <h2>앞으로 7일</h2>
      <ul id="week" class="list week"></ul>
    </section>
  </main>

  <div id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-label="언제 할까요">
      <p class="sheet-title">언제 할까요?</p>
      <div id="sheet-options"></div>
      <button id="sheet-pick" type="button">날짜 고르기…</button>
      <input id="sheet-date" type="date" aria-label="날짜 고르기">
    </div>
  </div>

  <div id="detail" hidden>
    <div class="detail-panel" role="dialog" aria-label="할 일 자세히">
      <div class="detail-head">
        <textarea id="detail-title" rows="1" aria-label="제목"></textarea>
        <button id="detail-close" type="button">닫기</button>
      </div>
      <p class="detail-label">연결된 문서</p>
      <ul id="detail-links"></ul>
      <form id="detail-link-form" autocomplete="off">
        <input id="detail-link" type="url" inputmode="url" placeholder="노션·드라이브 링크 붙여넣기" aria-label="링크 추가">
        <button type="submit">추가</button>
      </form>
      <p class="detail-label">메모 <span id="detail-note-state" class="muted"></span></p>
      <textarea id="detail-note" placeholder="자세한 내용, 진행 상황, 생각나는 것들…" aria-label="메모"></textarea>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="md.js"></script>
  <script src="drive.js"></script>
  <script src="store.js"></script>
  <script src="notes.js"></script>
  <script src="app.js"></script>
</body>
</html>
